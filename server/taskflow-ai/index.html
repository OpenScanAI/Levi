<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow AI</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-elevated: #111827;
    --bg-card: #1a2236;
    --bg-hover: #232d45;
    --border: #2a3650;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-elevated);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  .tabs {
    display: flex;
    gap: 8px;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:hover:not(.active) { background: var(--bg-hover); color: var(--text-primary); }

  main { flex: 1; padding: 28px 32px; max-width: 1100px; width: 100%; margin: 0 auto; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Input area */
  .task-input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .task-input-row input, .task-input-row select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .task-input-row input:focus, .task-input-row select:focus { border-color: var(--accent); }
  .task-input-row input { flex: 1; min-width: 220px; }
  .task-input-row select { min-width: 140px; }
  .btn {
    padding: 12px 22px;
    border-radius: var(--radius);
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
  }
  .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Task list */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: background 0.2s, border-color 0.2s;
  }
  .task-item:hover { border-color: #3b4a6b; }
  .task-item.completed { opacity: 0.55; }
  .task-item.completed .task-title { text-decoration: line-through; color: var(--text-secondary); }
  .task-check {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after {
    content: "✓"; color: #fff; font-size: 13px; font-weight: 700;
  }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 3px 8px; border-radius: 6px; background: var(--bg-hover); color: var(--text-secondary);
  }
  .badge.priority-high { background: rgba(239,68,68,0.15); color: var(--danger); }
  .badge.priority-medium { background: rgba(245,158,11,0.15); color: var(--warning); }
  .badge.priority-low { background: rgba(59,130,246,0.15); color: var(--info); }
  .badge.due-soon { background: rgba(239,68,68,0.12); color: #f87171; }
  .badge.due-later { background: rgba(34,197,94,0.12); color: var(--success); }

  .task-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .task-actions button {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
  }
  .task-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* Focus mode */
  .focus-hero {
    background: linear-gradient(135deg, #1a2236 0%, #111827 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    margin-bottom: 28px;
  }
  .focus-hero h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .focus-hero p { color: var(--text-secondary); margin-bottom: 20px; }
  .focus-task-display {
    background: var(--bg-card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 28px;
    margin: 20px 0;
    text-align: left;
  }
  .focus-task-display .focus-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; }
  .focus-task-display .focus-meta { color: var(--text-secondary); font-size: 0.9rem; }
  .focus-controls { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .timer { font-variant-numeric: tabular-nums; font-size: 2.4rem; font-weight: 800; color: var(--accent); margin: 10px 0; }

  /* Empty state */
  .empty { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
  .empty svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }

  /* Edit modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; width: 90%; max-width: 460px; box-shadow: var(--shadow);
  }
  .modal h3 { margin-bottom: 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-primary); padding: 10px 12px; border-radius: 10px; font-size: 1rem;
  }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  @media (max-width: 640px) {
    header { flex-direction: column; gap: 12px; align-items: flex-start; }
    main { padding: 18px; }
    .task-input-row input { min-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>TaskFlow <span>AI</span></h1>
  <nav class="tabs">
    <button class="tab active" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
    <button class="tab" data-tab="focus" onclick="switchTab('focus')">Focus</button>
  </nav>
</header>

<main>
  <!-- Tasks Panel -->
  <section id="panel-tasks" class="panel active">
    <div class="task-input-row">
      <input type="text" id="newTitle" placeholder="What needs to be done?" />
      <select id="newPriority">
        <option value="high">High Priority</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <input type="date" id="newDue" />
      <button class="btn btn-primary" onclick="addTask()">Add Task</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="task-list" id="taskList"></div>
    <div class="empty" id="emptyState" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      <p>No tasks yet. Add one above to get started.</p>
    </div>
  </section>

  <!-- Focus Panel -->
  <section id="panel-focus" class="panel">
    <div class="focus-hero">
      <h2>Focus Mode</h2>
      <p>One task at a time. No distractions. Let TaskFlow AI pick what matters most.</p>
      <div class="timer" id="timer">25:00</div>
      <div class="focus-controls">
        <button class="btn btn-primary" id="btnStart" onclick="startFocus()">Start Focus</button>
        <button class="btn btn-ghost" onclick="pauseFocus()">Pause</button>
        <button class="btn btn-danger" onclick="stopFocus()">Stop</button>
      </div>
    </div>

    <div id="focusTaskWrap" style="display:none">
      <h3 style="margin-bottom:12px">Current Focus</h3>
      <div class="focus-task-display" id="focusTaskDisplay"></div>
      <div style="text-align:center; margin-top:16px">
        <button class="btn btn-success" onclick="completeFocusTask()">Complete Task</button>
        <button class="btn btn-ghost" onclick="skipFocusTask()">Skip / Next</button>
      </div>
    </div>

    <div class="empty" id="focusEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <p>No incomplete tasks available. Add tasks to use Focus Mode.</p>
    </div>
  </section>
</main>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Task</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="editTitle" />
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="editPriority">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input type="date" id="editDue" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
/* ---------- State ---------- */
let tasks = loadTasks();
let editingId = null;
let focusInterval = null;
let focusSeconds = 25 * 60;
let focusRunning = false;
let currentFocusId = null;

/* ---------- Persistence ---------- */
function loadTasks() {
  try { return JSON.parse(localStorage.getItem('taskflow_tasks')) || []; }
  catch { return []; }
}
function saveTasks() {
  localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
  render();
}

/* ---------- Task CRUD ---------- */
function addTask() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;
  const priority = document.getElementById('newPriority').value;
  const due = document.getElementById('newDue').value;
  const task = {
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
    title,
    priority,
    due: due || null,
    completed: false,
    createdAt: Date.now()
  };
  tasks.push(task);
  document.getElementById('newTitle').value = '';
  document.getElementById('newDue').value = '';
  saveTasks();
}

function toggleComplete(id) {
  const t = tasks.find(x => x.id === id);
  if (t) { t.completed = !t.completed; saveTasks(); }
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  if (currentFocusId === id) { stopFocus(); }
  saveTasks();
}

function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('editTitle').value = t.title;
  document.getElementById('editPriority').value = t.priority;
  document.getElementById('editDue').value = t.due || '';
  document.getElementById('editModal').classList.add('open');
}
function closeEdit() { document.getElementById('editModal').classList.remove('open'); editingId = null; }
function saveEdit() {
  const t = tasks.find(x => x.id === editingId);
  if (t) {
    t.title = document.getElementById('editTitle').value.trim() || t.title;
    t.priority = document.getElementById('editPriority').value;
    const d = document.getElementById('editDue').value;
    t.due = d || null;
    saveTasks();
  }
  closeEdit();
}

/* ---------- Smart Prioritization ---------- */
function scoreTask(t) {
  if (t.completed) return -Infinity;
  let score = 0;
  // Priority weight
  score += (t.priority === 'high' ? 100 : t.priority === 'medium' ? 50 : 20);
  // Due date weight
  if (t.due) {
    const days = (new Date(t.due).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000;
    if (days < 0) score += 200; // overdue
    else if (days === 0) score += 150; // due today
    else if (days <= 2) score += 80;
    else if (days <= 7) score += 40;
    else score += 10;
  } else {
    score += 25; // no due date = moderate urgency
  }
  // Recency penalty (older tasks slightly more urgent)
  const ageDays = (Date.now() - t.createdAt) / 86400000;
  score += Math.min(ageDays * 2, 30);
  return score;
}

function sortedTasks() {
  return [...tasks].sort((a, b) => scoreTask(b) - scoreTask(a));
}

function topTask() {
  return sortedTasks().find(t => !t.completed) || null;
}

/* ---------- Rendering ---------- */
function render() {
  // Stats
  const total = tasks.length;
  const done = tasks.filter(t => t.completed).length;
  const high = tasks.filter(t => !t.completed && t.priority === 'high').length;
  const dueSoon = tasks.filter(t => {
    if (!t.due || t.completed) return false;
    const days = (new Date(t.due).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000;
    return days <= 2;
  }).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="value">${total - done}</div><div class="label">Remaining</div></div>
    <div class="stat-card"><div class="value">${done}</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="value">${high}</div><div class="label">High Priority</div></div>
    <div class="stat-card"><div class="value">${dueSoon}</div><div class="label">Due Soon</div></div>
  `;

  // Task list
  const list = document.getElementById('taskList');
  const ordered = sortedTasks();
  if (ordered.length === 0) {
    list.innerHTML = '';
    document.getElementById('emptyState').style.display = '';
  } else {
    document.getElementById('emptyState').style.display = 'none';
    list.innerHTML = ordered.map(t => {
      const dueLabel = t.due ? formatDue(t.due) : '';
      const dueClass = dueLabel.includes('Overdue') || dueLabel.includes('Today') ? 'due-soon' : 'due-later';
      return `
        <div class="task-item ${t.completed ? 'completed' : ''}">
          <div class="task-check ${t.completed ? 'checked' : ''}" onclick="toggleComplete('${t.id}')"></div>
          <div class="task-body">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-meta">
              <span class="badge priority-${t.priority}">${t.priority}</span>
              ${t.due ? `<span class="badge ${dueClass}">${dueLabel}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button onclick="openEdit('${t.id}')">Edit</button>
            <button onclick="deleteTask('${t.id}')">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Focus panel
  const ft = topTask();
  const focusWrap = document.getElementById('focusTaskWrap');
  const focusEmpty = document.getElementById('focusEmpty');
  if (ft) {
    focusWrap.style.display = '';
    focusEmpty.style.display = 'none';
    const isCurrent = currentFocusId === ft.id;
    document.getElementById('focusTaskDisplay').innerHTML = `
      <div class="focus-title">${escapeHtml(ft.title)}</div>
      <div class="focus-meta">
        Priority: <span class="badge priority-${ft.priority}">${ft.priority}</span>
        ${ft.due ? ` &middot; Due: ${formatDue(ft.due)}` : ''}
        ${isCurrent ? ' &middot; <strong>Currently Focusing</strong>' : ''}
      </div>
    `;
  } else {
    focusWrap.style.display = 'none';
    focusEmpty.style.display = '';
  }
}

function formatDue(dueStr) {
  const d = new Date(dueStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d.setHours(0,0,0,0) - today) / 86400000);
  if (diff < 0) return 'Overdue';
  if (diff === 0) return 'Due Today';
  if (diff === 1) return 'Due Tomorrow';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Tabs ---------- */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

/* ---------- Focus Timer ---------- */
function startFocus() {
  if (focusRunning) return;
  const ft = topTask();
  if (!ft) return;
  currentFocusId = ft.id;
  focusRunning = true;
  document.getElementById('btnStart').textContent = 'Focusing...';
  render();
  focusInterval = setInterval(() => {
    focusSeconds--;
    if (focusSeconds <= 0) {
      clearInterval(focusInterval);
      focusRunning = false;
      focusSeconds = 25 * 60;
      document.getElementById('btnStart').textContent = 'Start Focus';
      alert('Focus session complete! Take a break.');
    }
    updateTimerDisplay();
  }, 1000);
}
function pauseFocus() {
  if (!focusRunning) return;
  clearInterval(focusInterval);
  focusRunning = false;
  document.getElementById('btnStart').textContent = 'Resume Focus';
}
function stopFocus() {
  clearInterval(focusInterval);
  focusRunning = false;
  focusSeconds = 25 * 60;
  currentFocusId = null;
  document.getElementById('btnStart').textContent = 'Start Focus';
  updateTimerDisplay();
  render();
}
function updateTimerDisplay() {
  const m = String(Math.floor(focusSeconds / 60)).padStart(2, '0');
  const s = String(focusSeconds % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}
function completeFocusTask() {
  const ft = topTask();
  if (ft) {
    ft.completed = true;
    saveTasks();
    stopFocus();
  }
}
function skipFocusTask() {
  // Move current top task to end by bumping createdAt so next task surfaces
  const ft = topTask();
  if (ft) {
    ft.createdAt = Date.now();
    saveTasks();
    stopFocus();
  }
}

/* ---------- Init ---------- */
render();
</script>
</body>
</html>
